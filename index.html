    <script>
      // Cache Buster & Immediate Update Invalidation
      (function() {
        var APP_BUILD_SIG = 'build-v3-standalone-homepage';
        if (typeof window !== 'undefined' && window.localStorage) {
          var prevSig = localStorage.getItem('solo_system_build_sig');
          if (prevSig !== APP_BUILD_SIG) {
            localStorage.setItem('solo_system_build_sig', APP_BUILD_SIG);
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
          }
        }
      })();
    </script>
