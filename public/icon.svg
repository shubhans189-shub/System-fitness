<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="swordBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded edges -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="#1e293b" stroke-width="3"/>
  <rect width="470" height="470" x="21" y="21" rx="90" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- System Hologram Window Frame -->
  <rect x="76" y="76" width="360" height="360" rx="20" fill="#0f172a" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Corner Tech Accents -->
  <path d="M 96 116 L 96 96 L 116 96" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 416 116 L 416 96 L 396 96" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 96 396 L 96 416 L 116 416" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 416 396 L 416 416 L 396 416" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Solo Leveling Dagger / Blade Crest -->
  <g transform="translate(256, 256)">
    <!-- Aura Rays -->
    <circle r="120" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 6" opacity="0.4"/>
    <circle r="90" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>

    <!-- Central Blade -->
    <path d="M 0 -130 L 18 -100 L 14 60 L 26 70 L 26 82 L 8 84 L 8 120 L -8 120 L -8 84 L -26 82 L -26 70 L -14 60 L -18 -100 Z" fill="url(#swordBlade)" filter="url(#glow)"/>
    <line x1="0" y1="-120" x2="0" y2="70" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    
    <!-- Crossguard Gems / Runes -->
    <circle cx="0" cy="76" r="6" fill="#38bdf8"/>
    
    <!-- Level Up Text / Rank S mark -->
    <path d="M -50 -40 L -30 -40 L -30 -20 L -50 -20 L -50 0 L -30 0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M 30 -40 L 50 -40 L 50 -20 L 30 -20 L 30 0 L 50 0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- SYSTEM Prompt Header Text -->
  <text x="256" y="130" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" letter-spacing="6" text-anchor="middle">QUEST: LEVEL UP</text>
  <text x="256" y="400" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="4" text-anchor="middle">SOLO FITNESS SYSTEM</text>
</svg>
